# Açılış sayfasını GitHub Pages'e yayınlar.
#
# NEDEN BİR İŞ AKIŞI GEREKİYOR
#
# Pages'in "bir daldan yayınla" seçeneği klasör olarak yalnızca `/` veya
# `/docs` kabul ediyor; sayfamız `site/` altında. Depo kökünü yayınlamak
# eklenti kaynağını, `/docs`'u yayınlamak da ADR'leri ve sürüm notlarını
# siteye çevirirdi. Bu yüzden sayfa bir artefakt olarak yükleniyor.
#
# Pages kaynağı bu iş akışıyla eşleşmek zorunda: depo ayarlarında
# Pages → Source = "GitHub Actions" (API'de `build_type: workflow`).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım; sıradaki beklesin, çalışan iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
